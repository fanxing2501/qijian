font pango:Sans 14
xwayland force
output * bg #0d0f13 solid_color
default_border none
default_floating_border none
focus_follows_mouse no
focus_on_window_activation none

# Only client management windows are hidden. Games use steam_app_<appid>.
no_focus [class="(?i)^steam$"]
for_window [class="(?i)^steam$"] move container to workspace __background
for_window [app_id="(?i)^steam$"] move container to workspace __background
for_window [app_id="^htpc-next$"] move container to workspace home, fullscreen enable
for_window [class="^steam_app_[0-9]+$"] move container to workspace game, fullscreen enable
workspace home
bindsym Mod4+Escape workspace home
bindsym Mod4+Return workspace game

# Resolve the compositor/Xwayland environment before starting desktop programs.
exec /bin/sh "$HTPC_DESKTOP_RELEASE/session-env.sh"
