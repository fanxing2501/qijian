font pango:Sans 14
xwayland force
output * bg #0d0f13 solid_color
default_border none
default_floating_border none
focus_follows_mouse no
focus_on_window_activation none

# Assign before the window is mapped. A fullscreen window initially mapped on
# home would unset Chromium's fullscreen before a for_window move can run.
assign [app_id="^htpc-next$"] workspace home
assign [class="(?i)^steam$"] workspace __background
assign [app_id="(?i)^steam$"] workspace __background
assign [class="^steam_app_[0-9]+$"] workspace game
assign [app_id="^steam_app_[0-9]+$"] workspace game
assign [class="(?i)^gamescope$"] workspace game
assign [app_id="(?i)^gamescope$"] workspace game

# Keep late class/app-id changes covered as well. Only management is hidden.
no_focus [class="(?i)^steam$"]
no_focus [app_id="(?i)^steam$"]
for_window [class="(?i)^steam$"] move container to workspace __background
for_window [app_id="(?i)^steam$"] move container to workspace __background
for_window [app_id="^htpc-next$"] move container to workspace home, fullscreen enable
for_window [class="^steam_app_[0-9]+$"] move container to workspace game, fullscreen enable
for_window [app_id="^steam_app_[0-9]+$"] move container to workspace game, fullscreen enable
for_window [class="(?i)^gamescope$"] move container to workspace game, fullscreen enable
for_window [app_id="(?i)^gamescope$"] move container to workspace game, fullscreen enable
workspace home
bindsym Mod4+Escape workspace home
bindsym Mod4+Return workspace game

# Resolve the compositor/Xwayland environment before starting desktop programs.
exec /bin/sh "$HTPC_DESKTOP_RELEASE/session-env.sh"
