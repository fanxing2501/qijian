version: 1
jobs:
  - name: desktop-package
    run: sh scripts/desktop-package.sh
  - name: desktop-upload
    needs: [desktop-package]
    run: |
      . ./config.env
      . "./$DESKTOP_RELEASE_MANIFEST"
      for file in "$ARTIFACT_FILE" "$ARTIFACT_FILE.sha256"; do
        curl --fail --silent --show-error --retry 3 --upload-file "artifacts/$file" "$S3_UPLOAD_BASE/$file"
      done
  - name: desktop-deploy
    needs: [desktop-upload, steam-bootstrap]
    run: sh scripts/desktop-deploy.sh
  - name: desktop-input-prepare
    needs: [desktop-upload]
    run: sh scripts/desktop-input-prepare.sh
  - name: steam-bootstrap
    run: sh scripts/steam-bootstrap.sh
  - name: desktop-smoke
    run: bun scripts/native-live-smoke.ts
  - name: gamescope-smoke
    run: bun scripts/gamescope-live-smoke.ts
  - name: lock
    run: bun install --lockfile-only
  - name: install
    run: bun install --frozen-lockfile
  - name: css-build
    needs: [install]
    run: bun run --bun css:build
  - name: test
    run: |
      bun test scripts/native-steam.test.ts
      sh scripts/scala.sh test shared server
  - name: server-build
    run: sh scripts/scala.sh compile shared server/project.scala server/src/main
  - name: client-build
    run: |
      mkdir -p dist/web
      sh scripts/scala.sh --power package shared client --js --js-module-kind esmodule -o dist/web/app.js --force
      cp client/public/* dist/web/
  - name: player-assets
    needs: [install]
    run: |
      mkdir -p dist/web
      cp node_modules/shaka-player/dist/shaka-player.compiled.js dist/web/shaka-player.js
      cp node_modules/shaka-player/LICENSE dist/web/shaka-LICENSE.txt
  - name: player-test-build
    run: |
      mkdir -p .runtime/player-fixture
      sh scripts/scala.sh --power package shared client client-test --workspace .runtime/player-scala --js --js-module-kind esmodule --main-class htpc.client.playertest.PlayerFixture -o .runtime/player-fixture/app.js --force
      sh scripts/player-test-media.sh
  - name: player-test
    needs: [player-test-build, player-assets, css-build]
    run: bun scripts/player-test.ts
  - name: build
    needs: [test, server-build, client-build, css-build, player-assets]
    run: bun scripts/version-assets.ts
  - name: native-build
    run: sh scripts/native-build.sh
  - name: wine-runtime
    run: sh scripts/wine-runtime.sh
  - name: server-package
    needs: [build]
    run: sh scripts/scala.sh --power package shared server/project.scala server/src/main --assembly --preamble=false --main-class htpc.server.Main -o dist/htpc-next.jar --force
  - name: integration-test
    needs: [server-package, native-build, player-test-build]
    run: bun scripts/integration.ts
  - name: package
    needs: [integration-test, native-build]
    run: sh scripts/package.sh
  - name: upload
    needs: [package]
    run: sh scripts/upload.sh
  - name: deploy
    needs: [upload]
    run: sh scripts/deploy.sh
  - name: status
    run: |
      . ./config.env
      curl --fail --silent --show-error "http://$HTPC_HOST:$HTPC_PORT/api/v1/health"
  - name: run
    needs: [client-build, css-build, player-assets]
    run: sh scripts/run.sh
